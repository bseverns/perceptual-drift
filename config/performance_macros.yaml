# Musician-facing controls.  These are deliberately the only paths a live
# performance overlay may affect.  Values are applied in memory only.
version: 1
slew_ms: 220
macros:
  drift:
    label: Drift
    type: bipolar
    default: 0.0
    description: Spatial breadth of lateral movement.
    targets:
      - path: mapping.lateral.gain
        mode: multiply
        min: 0.5
        max: 1.4
  touch:
    label: Touch
    type: bipolar
    default: 0.0
    description: From soft and forgiving to immediate response.
    targets:
      - path: mapping.lateral.deadzone
        mode: add
        min: -0.12
        max: 0.12
      - path: mapping.lateral.curvature
        mode: add
        min: -0.65
        max: 0.65
  turn:
    label: Turn
    type: bipolar
    default: 0.0
    description: A gentle left/right yaw tendency.
    targets:
      - path: mapping.yaw_bias.bias
        mode: add
        min: -0.20
        max: 0.20
  nervousness:
    label: Nervousness
    type: unipolar
    default: 0.0
    description: Adds bounded instability to yaw.
    targets:
      - path: mapping.yaw_bias.jitter
        mode: add
        min: 0.0
        max: 0.25
  crowd_fx:
    label: Crowd FX
    type: unipolar
    default: 0.35
    description: Visual and lighting intensity for crowd energy.
    scope: visuals
    requires: [video_or_lighting_runtime]
    targets:
      - path: mapping.glitch_intensity.base
        mode: add
        min: 0.05
        max: 0.70
  visual_memory:
    label: Visual Memory
    type: unipolar
    default: 0.25
    description: Feedback persistence where the selected visual pipeline supports it.
    scope: visuals
    requires: [video_runtime]
    targets:
      - path: mapping.glitch_intensity.max
        mode: add
        min: 0.35
        max: 1.0
